[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="odoo-reference-controls"
version="0.4.0"
description="Public nontraining Odoo GUI reference controls with saved-state verification"
readme="README.md"
requires-python=">=3.11"
dependencies=["playwright>=1.51","Pillow>=10","reportlab>=4"]
[project.scripts]
odoo-reference="odoo_reference.cli:main"
[tool.setuptools.packages.find]
where=["src"]
include=["odoo_reference*"]
namespaces=true
[tool.setuptools.package-data]
odoo_reference=["compose.yaml","runtime/**/*.py","runtime/source-lock.json"]
