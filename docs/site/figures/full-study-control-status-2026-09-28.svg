  <text x="73" y="371" font-family="Arial,sans-serif" font-size="14" fill="#536d73">Revised v2 runtime, saved positive / wrong variant / fresh reset</text>
  <rect x="73" y="385" width="1080" height="38" rx="7" fill="#e4eae8"/>
