  <text x="56" y="55" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#247169">ENVLOOP / DEVELOPMENT EVIDENCE</text>
  <text x="56" y="101" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#173b43">Two evaluator-control lanes at an interruption</text>
  <text x="56" y="131" font-family="Arial,sans-serif" font-size="16" fill="#536d73">28 September 2026 snapshot · 100 offline final candidates per lane · no model outcomes</text>

  <rect x="50" y="165" width="1180" height="310" rx="15" fill="#fff" stroke="#c9d9d5"/>
