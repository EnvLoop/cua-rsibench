name: ${ODOO_PROJECT:-envloop-odoo-fallback}

services:
  db:
    image: postgres@sha256:724292da1f2e50bdccfc3302ce75bbba7f4a6076701b588cc795fcac65683550
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?set a local password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  web:
    image: odoo@sha256:478065867b945579649373aa4cca3b56f7b74daf0522e5fdf85e7d1262e11d39
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_PORT:-8078}:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?set a local password}
    volumes:
      - filestore:/var/lib/odoo
    command: ["odoo", "-d", "bench", "--db-filter=^bench$", "--no-database-list", "--max-cron-threads=0"]

  init:
    profiles: ["bootstrap"]
    image: odoo@sha256:478065867b945579649373aa4cca3b56f7b74daf0522e5fdf85e7d1262e11d39
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?set a local password}
    volumes:
      - filestore:/var/lib/odoo
    command: ["odoo", "-d", "bench", "-i", "base,contacts,crm,sale_management,purchase,stock", "--without-demo=all", "--stop-after-init", "--max-cron-threads=0"]

volumes:
  pgdata:
  filestore:
