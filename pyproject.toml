[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cua-rsibench"
version = "0.4.0"
description = "A controlled real-application browser-use data-research benchmark"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
browser = ["playwright==1.63.0"]
cloud = ["httpx[http2]==0.28.1", "e2b==2.51.0", "tinker==0.30.0", "jinja2>=3.1,<4"]
harbor = ["harbor[e2b]==0.23.0"]
report = ["reportlab==5.0.1", "pypdf==6.19.0", "matplotlib==3.11.2"]

[tool.setuptools.package-data]
cursibench = ["web/*.html"]

[project.scripts]
cua-rsibench = "cursibench.__main__:main"
